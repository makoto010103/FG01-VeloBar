<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VeloBar v4.3.2</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;600&family=Share+Tech+Mono&display=swap"
        rel="stylesheet">
    <style>
        /* ===== STARTUP PICKER MODAL ===== */
        #startup-modal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            /* PCでは中央寄りに配置 */
            background: rgba(10, 20, 40, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        @media (max-width: 600px) {
            #startup-modal {
                justify-content: flex-end;
            }

            /* モバイルでは下部に配置 */
        }

        .modal-sheet {
            width: 98%;
            max-width: 600px;
            /* Expanded for 5 pickers */
            background: rgba(30, 41, 59, 0.96);
            border-radius: 24px;
            padding: 24px 16px 40px;
            box-shadow: 0 8px 40px rgba(0, 243, 255, 0.2);
            border: 1px solid rgba(0, 243, 255, 0.2);
            animation: slideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @media (max-width: 600px) {
            .modal-sheet {
                border-radius: 24px 24px 0 0;
                width: 100%;
                border-left: none;
                border-right: none;
                border-bottom: none;
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-handle {
            width: 40px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            margin: 0 auto 20px;
        }

        .modal-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            color: var(--primary);
            text-align: center;
            margin-bottom: 24px;
            letter-spacing: 2px;
        }

        .pickers-row {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .picker-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .picker-label {
            font-size: 0.75rem;
            color: var(--text-dim);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .picker-container {
            position: relative;
            width: 100%;
            height: 230px;
            /* Exactly 5 items (46px * 5) */
            overflow: hidden;
            border-radius: 14px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(0, 243, 255, 0.15);
        }

        /* Selection highlight band */
        .picker-container::before,
        .picker-container::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            height: 60px;
            z-index: 2;
            pointer-events: none;
        }

        .picker-container::before {
            top: 0;
            background: linear-gradient(to bottom, rgba(30, 41, 59, 0.95), transparent);
        }

        .picker-container::after {
            bottom: 0;
            background: linear-gradient(to top, rgba(30, 41, 59, 0.95), transparent);
        }

        .picker-selection-band {
            position: absolute;
            top: 92px;
            /* Exactly 2 items down (46px * 2) */
            left: 0;
            right: 0;
            height: 46px;
            background: rgba(0, 243, 255, 0.08);
            border-top: 1px solid rgba(0, 243, 255, 0.3);
            border-bottom: 1px solid rgba(0, 243, 255, 0.3);
            z-index: 1;
            pointer-events: none;
        }

        .picker-scroll {
            height: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            -ms-overflow-style: none;
            /* Safari等のバグ対策: paddingの代わりに擬似要素を使う */
        }

        .picker-scroll::before,
        .picker-scroll::after {
            content: '';
            display: block;
            height: 92px;
            /* Exactly 2 blank items */
        }

        .picker-scroll::-webkit-scrollbar {
            display: none;
        }

        .picker-item {
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            scroll-snap-align: center;
            font-size: 1.1rem;
            /* Slightly smaller to fit 5 cols */
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            transition: color 0.15s, font-size 0.15s;
            cursor: default;
            user-select: none;
            text-align: center;
        }

        .picker-item.active {
            color: var(--primary);
            font-size: 1.25rem;
            text-shadow: 0 0 12px rgba(0, 243, 255, 0.5);
        }

        .picker-suffix {
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-left: 4px;
            font-family: 'Inter', sans-serif;
        }

        .btn-start {
            width: 100%;
            margin-top: 24px;
            padding: 16px;
            background: linear-gradient(135deg, #00f3ff 0%, #0088ff 100%);
            color: #0f172a;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 2px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px 24px rgba(0, 243, 255, 0.4);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .btn-start:active {
            transform: scale(0.97);
            box-shadow: 0 2px 12px rgba(0, 243, 255, 0.3);
        }

        :root {
            --primary: #00f3ff;
            --bg: #0f172a;
            --surface: #1e293b;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --good: #22c55e;
            --warning: #f59e0b;
            --stop: #ef4444;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            /* Prevent horizontal scroll */
        }

        /* Ultra Compact Header v2.2 + v3.0 Mode Selector */
        .header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            /* Ultra-compact padding */
            background: var(--surface);
            border-bottom: 1px solid #334155;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            /* Smaller font */
            margin: 0;
            color: var(--primary);
            letter-spacing: 1px;
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
            background: #334155;
            color: var(--text-dim);
            transition: all 0.3s;
        }

        .status-badge.connected {
            background: rgba(34, 197, 94, 0.2);
            color: var(--good);
        }

        /* Mode Selector */
        .mode-select {
            background: #334155;
            color: var(--text);
            border: 1px solid #475569;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 0.8rem;
            font-family: 'Inter', sans-serif;
            outline: none;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 10px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            /* Extremely reduced gap */
        }

        /* Main Metric Card - v3.0 Layout */
        .metric-card {
            background: var(--surface);
            border-radius: 16px;
            padding: 12px;
            /* Ultra compact */
            margin-bottom: 4px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
            border: 2px solid #334155;
            /* Default neutral border */
            position: relative;
            overflow: hidden;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        /* Traffic Light System Styles */
        .status-good {
            border-color: var(--good) !important;
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.2) !important;
        }

        .status-warning {
            border-color: var(--warning) !important;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.2) !important;
        }

        .status-stop {
            border-color: var(--stop) !important;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4) !important;
        }

        .metric-label {
            font-size: 0.85rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .metric-value-container {
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: 4px;
        }

        .metric-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 4.5rem;
            /* Large visibility */
            font-weight: 700;
            color: var(--text);
            line-height: 1;
        }

        .metric-unit {
            font-size: 1.5rem;
            color: var(--text-dim);
        }

        /* Sub Metrics (Rep, Best, Fatigue) */
        .sub-metrics {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
            /* compact */
            padding-top: 8px;
            border-top: 1px solid #334155;
        }

        .sub-metric {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .sub-metric .label {
            font-size: 0.7rem;
            color: var(--text-dim);
        }

        .sub-metric .value {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text);
        }

        .fatigue-value {
            color: var(--text);
            /* Will be dynamic */
        }

        /* Rep Change Overlay */
        .rep-change {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            position: absolute;
            top: 16px;
            right: 16px;
        }

        /* Warning Banners */
        .alert-banner {
            background: rgba(239, 68, 68, 0.2);
            color: var(--stop);
            padding: 8px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            display: none;
            /* Hidden by default */
            margin-top: 8px;
            border: 1px solid var(--stop);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 0.8;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.8;
            }
        }

        /* Graph Container */
        .graph-container {
            background: var(--surface);
            border-radius: 16px;
            padding: 8px;
            border: 1px solid #334155;
            height: 160px;
            /* Reduced fixed height */
            position: relative;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Countdown Overlay */
        #countdown-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        #countdown-overlay.active {
            display: flex;
        }

        #countdown-number {
            font-family: 'Orbitron', sans-serif;
            font-size: 30vw;
            font-weight: 900;
            color: var(--primary);
            text-shadow: 0 0 60px var(--primary), 0 0 120px var(--primary);
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.1);
                opacity: 0.8;
            }
        }

        /* Control Panel */
        .control-panel {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-top: 4px;
        }

        .btn-main {
            grid-column: 1 / -1;
            padding: 16px;
            font-size: 1.25rem;
            border-radius: 12px;
            background: linear-gradient(135deg, #00f3ff 0%, #0088ff 100%);
            color: #0f172a;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            border: none;
            box-shadow: 0 4px 15px rgba(0, 243, 255, 0.4);
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-main:active {
            transform: scale(0.97);
        }

        .btn-main.running {
            background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
            color: white;
        }

        .btn {
            background: var(--surface);
            border: 1px solid #334155;
            color: var(--text);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: rgba(0, 243, 255, 0.1);
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Rest Timer Overlay */
        #rest-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.95);
            z-index: 900;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        #rest-overlay.active {
            display: flex;
        }

        .rest-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            color: var(--text-dim);
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .rest-time {
            font-family: 'Orbitron', sans-serif;
            font-size: 25vw;
            font-weight: 900;
            color: var(--primary);
            text-shadow: 0 0 40px rgba(0, 243, 255, 0.4);
            line-height: 1;
        }

        .rest-time.ready {
            color: var(--good);
            text-shadow: 0 0 40px rgba(34, 197, 94, 0.4);
        }

        .btn-skip-rest {
            margin-top: 40px;
            padding: 16px 40px;
            font-size: 1.2rem;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text);
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-skip-rest.ready {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            border: none;
            color: #0f172a;
            box-shadow: 0 4px 20px rgba(34, 197, 94, 0.4);
            animation: pulse 1.5s infinite;
        }

        .set-progress {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            color: var(--primary);
            padding: 4px 12px;
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 12px;
            letter-spacing: 1px;
        }

        /* Set Summary Overlay */
        .summary-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .summary-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .summary-card {
            background: var(--surface);
            padding: 24px;
            border-radius: 16px;
            text-align: center;
            width: 80%;
            max-width: 320px;
            border: 1px solid var(--primary);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.2);
        }

        .summary-title {
            font-size: 1.5rem;
            color: var(--text);
            margin-bottom: 16px;
            font-family: 'Orbitron', sans-serif;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 1rem;
            color: var(--text-dim);
        }

        .summary-row span.val {
            color: var(--text);
            font-weight: 600;
        }

        .summary-reason {
            color: var(--stop);
            font-weight: bold;
            margin-top: 12px;
            font-size: 1.1rem;
        }

        /* Log Table */
        .log-container {
            background: var(--surface);
            border-radius: 16px;
            padding: 12px;
            border: 1px solid #334155;
            max-height: 200px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        th,
        td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }

        th {
            color: var(--text-dim);
            font-weight: 500;
        }

        td {
            color: var(--text);
        }

        /* Connection Log (Hidden mostly but useful for debug) */
        #connection-log {
            font-size: 0.7rem;
            color: var(--text-dim);
            margin-top: 10px;
            max-height: 50px;
            overflow-y: auto;
        }
    </style>
</head>

<body>

    <!-- ===== STARTUP PICKER MODAL ===== -->
    <div id="startup-modal">
        <div class="modal-sheet">
            <div class="modal-handle"></div>
            <div class="modal-title">⚡ SETUP</div>
            <div class="pickers-row">
                <!-- Exercise Picker -->
                <div class="picker-wrap" style="flex:0.8;">
                    <div class="picker-label">種目</div>
                    <div class="picker-container">
                        <div class="picker-selection-band"></div>
                        <div class="picker-scroll" id="exercise-picker">
                            <div class="picker-item" data-value="SQ">SQ</div>
                            <div class="picker-item" data-value="DL">DL</div>
                            <div class="picker-item" data-value="BP">BP</div>
                            <div class="picker-item" data-value="CL">CL</div>
                            <div class="picker-item" data-value="Other">Oth</div>
                        </div>
                    </div>
                    <div style="font-size:0.7rem;color:var(--text-dim);" id="exercise-label-hint">スクワット</div>
                </div>
                <!-- Weight Picker -->
                <div class="picker-wrap">
                    <div class="picker-label">重量</div>
                    <div class="picker-container">
                        <div class="picker-selection-band"></div>
                        <div class="picker-scroll" id="weight-picker">
                        </div>
                    </div>
                    <div style="font-size:0.7rem;color:var(--text-dim);">kg</div>
                </div>
                <!-- Target Reps Picker -->
                <div class="picker-wrap">
                    <div class="picker-label">Reps</div>
                    <div class="picker-container">
                        <div class="picker-selection-band"></div>
                        <div class="picker-scroll" id="reps-picker">
                            <!-- 1-15 generated via JS -->
                        </div>
                    </div>
                </div>

                <div class="picker-wrap">
                    <div class="picker-label">Sets</div>
                    <div class="picker-container">
                        <div class="picker-selection-band"></div>
                        <div class="picker-scroll" id="sets-picker">
                            <!-- 1-10 generated via JS -->
                        </div>
                    </div>
                </div>

                <div class="picker-wrap">
                    <div class="picker-label">Rest</div>
                    <div class="picker-container">
                        <div class="picker-selection-band"></div>
                        <div class="picker-scroll" id="rest-picker">
                            <!-- e.g. 1.0, 1.5, 2.0... generated via JS -->
                        </div>
                    </div>
                </div>
            </div>
            <button class="btn-start" onclick="confirmSetup()">RECORD SET</button>
        </div>
    </div>

    <!-- Overlay for Set Summary -->

    <div id="summary-overlay" class="summary-overlay" onclick="closeSummary()">
        <div class="summary-card">
            <div class="summary-title">セット終了</div>
            <div class="summary-row"><span>自己ベスト</span><span class="val" id="sum-best">-</span></div>
            <div class="summary-row"><span>平均速度</span><span class="val" id="sum-avg">-</span></div>
            <div class="summary-row"><span>回数</span><span class="val" id="sum-reps">-</span></div>
            <div class="summary-reason" id="sum-reason">理由</div>
            <div style="margin-top: 20px; font-size: 0.8rem; color: #64748b;">(タップして閉じる)</div>
        </div>
    </div>

    <!-- REST TIMER OVERLAY -->
    <div id="rest-overlay">
        <div class="rest-title" id="rest-title-text">REST TIME</div>
        <div class="rest-time" id="rest-time-display">2:00</div>
        <button class="btn-skip-rest" id="btn-skip-rest" onclick="skipRest()">SKIP</button>
    </div>

    <!-- Countdown Overlay -->
    <div id="countdown-overlay">
        <span id="countdown-number">5</span>
    </div>

    <div class="header">
        <div class="header-left">
            <h1>VeloBar <span style="font-size: 0.9rem; color: var(--text-dim); font-weight: 500;">v4.3.2</span></h1>
            <div style="display: flex; gap: 8px; align-items: center;">
                <span id="bt-status" class="status-badge">未接続</span>
                <span id="battery-status" class="status-badge"
                    style="background: rgba(255,255,255,0.1); display: none;">🔋 --%</span>
            </div>
        </div>
        <!-- Mode Selector -->
        <select id="mode-select" class="mode-select" onchange="updateMode()">
            <option value="POWER">パワー (VL 20%)</option>
            <option value="STRENGTH">筋力 (VL 25%)</option>
            <option value="HYPERTROPHY">筋肥大 (VL 35%)</option>
        </select>
    </div>

    <div class="container">

        <!-- Status Bar -->
        <div
            style="display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-dim); align-items: center; margin-bottom: 8px;">
            <div id="current-setup-info">SET START で設定してください</div>
            <div style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end;">
                <div>
                    自動終了(VBT):
                    <select id="auto-stop-select" class="mode-select" style="font-size: 0.75rem; padding: 2px 4px;">
                        <option value="ON">ON</option>
                        <option value="OFF">OFF</option>
                    </select>
                </div>
                <div>
                    通知音:
                    <select id="sound-select" class="mode-select" style="font-size: 0.75rem; padding: 2px 4px;">
                        <option value="BELL">ベル</option>

        <!-- Metric Card & Sub Metrics (Added Set Progress) -->

        <div id="metric-card" class="metric-card">

            </div>

            <div id="rep-change" class="rep-change">-</div>

            <!-- Alerts -->
            <div id="alert-banner" class="alert-banner">パワーゾーン圏外</div>

            <div class="sub-metrics" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                <div class="sub-metric">
                    <span class="label">回数</span>
                    <span id="rep-count" class="value">0 / --</span>
                </div>
                <div class="sub-metric">
                    <span class="label">Peak (m/s)</span>
                    <span id="last-rep-max" class="value">0.00</span>
                </div>
                <div class="sub-metric">
                    <span class="label">対ベスト疲労度</span>
                    <span id="fatigue-val" class="value fatigue-value">0%</span>
                </div>

                    <span id="neural-readiness" class="value" style="color:var(--good);">--%</span>

        <div class="graph-container">
            <canvas id="vbtCanvas"></canvas>
        </div>

        <div class="control-panel">
            <button id="main-start-btn" class="btn-main" onclick="handleStartSet()">▶ SET START</button>
            <button id="connect-btn" class="btn"><span>⚡</span> 接続</button>
            <button class="btn" onclick="resetMax()"><span>🔄</span> リセット</button>
            <button class="btn" onclick="copyToClipboard(false)"><span>📋</span> CSV</button>
        </div>

        <div class="log-container">
            <table>
                <thead>
                    <tr>
                        <th>時刻</th>
                        <th>MPV / <span style="font-size:0.8em;color:var(--text-dim);">Peak</span></th>
                        <th>比率</th>
                        <th>疲労度</th>

                    <!-- Logs go here -->
                </tbody>
