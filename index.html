        <div id="record-status" style="text-align: center; color: var(--text-dim); font-size: 0.8rem;"></div>
        <div id="connection-log"></div>
    </div>

    <script>
        // --- 描画エンジン (ライブラリなし) ---
        class LiveGraph {
            constructor(canvasId) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.data = [];
                // 50Hz * 8秒 = 400点 (波形の幅を広げる)
                this.maxPoints = 400;
                this.yLimit = 3.0; // 0〜3m/s (VBTの主要レンジ)

                this.resize();
                window.addEventListener('resize', () => this.resize());
            }

            resize() {
                this.canvas.width = this.canvas.clientWidth * window.devicePixelRatio;
                this.canvas.height = this.canvas.clientHeight * window.devicePixelRatio;
            }

            addPoint(val) {
                this.data.push(val);
                if (this.data.length > this.maxPoints) {
                    this.data.shift();
                }

                // Web Bluetoothの受信スレッドを詰まらせないために、描画をブラウザのレンダリングサイクルに委譲する
                if (!this.pendingDraw) {
                    this.pendingDraw = true;
                    requestAnimationFrame(() => this.draw());
                }
            }

            draw() {
                this.pendingDraw = false;
                const { width, height } = this.canvas;
                const ctx = this.ctx;

                ctx.clearRect(0, 0, width, height);

                // Grid
                ctx.strokeStyle = '#1e293b'; // Dark blue grid
                ctx.lineWidth = 1;
                ctx.beginPath();
                for (let i = 0; i <= this.yLimit; i += 1) {
                    let y = height - (i / this.yLimit) * height;
                    ctx.moveTo(0, y);
                    ctx.lineTo(width, y);
                }
                ctx.stroke();

                // Baseline (0 m/s)
                ctx.strokeStyle = '#475569';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, height - 2); // Slightly offset for visibility
                ctx.lineTo(width, height - 2);
                ctx.stroke();

                // Data Plot
                if (this.data.length < 2) return;

                ctx.strokeStyle = '#00f3ff'; // Bright Cyan for Data
                ctx.lineWidth = 3;
                // Revert Deadzone Logic (User Request)
                // But make it slightly more lenient for visibility?
                // "0.003" is serial. "0.01" filter.
                // If user shakes it, it should exceed 0.01 easily unless broken.
                // User says "0.003" in SERIAL. That is TINY. Usually stationary noise.
                // If the user moves it, it should jump to >0.1.

                ctx.shadowBlur = 10;
                ctx.shadowColor = '#00f3ff';
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.beginPath();

                for (let i = 0; i < this.data.length; i++) {
                    let x = (i / (this.maxPoints - 1)) * width;
                    let plotVal = Math.max(0, Math.min(this.yLimit, this.data[i]));
                    let y = height - (plotVal / this.yLimit) * height;

                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
                ctx.shadowBlur = 0; // Reset shadow
            }
        }

        function setLog(msg, color = null) {
            const logEl = document.getElementById('connection-log');
            if (logEl) {
                const line = document.createElement('div');
                line.style.color = color || 'var(--text-dim)';
                line.innerHTML = `> ${msg}`;
                logEl.prepend(line);
                if (logEl.children.length > 5) {
                    logEl.removeChild(logEl.lastChild);
                }
            }
        }

        let rawLogBuffer = [];
        let isRawRecording = false;
        let isCountingDown = false;
        let countdownTimer = null;

        // Auto recording wrapper
        function startAutoRecording() {
            isRawRecording = true;
            rawLogBuffer = [];
            // Remove countdown overlay usage since we want instant start
        }

        function toggleRawRecording() {
            const btn = document.getElementById('record-btn');
            if (isCountingDown) return; // Ignore if already counting down
            if (!isRawRecording) {
                // Start Countdown
                isCountingDown = true;
                rawLogBuffer = [];
                btn.innerHTML = '<span>⏳</span> 準備中...';
                btn.style.borderColor = '#f59e0b';
                btn.style.color = '#f59e0b';
                btn.disabled = true;

                const overlay = document.getElementById('countdown-overlay');
                const numEl = document.getElementById('countdown-number');
                overlay.classList.add('active');
                let count = 5;
                numEl.innerText = count;

                // Countdown beep function
                function playCountdownBeep(isLast) {
                    try {
                        if (!window.toneGen) return;
                        if (!window.toneGen.ctx) window.toneGen.init();
                        window.toneGen.resume();
                        const actx = window.toneGen.ctx;

                        const osc = actx.createOscillator();
                        const gain = actx.createGain();
                        osc.connect(gain);
                        gain.connect(actx.destination);
                        osc.frequency.value = isLast ? 1200 : 800; // High pitch for "GO"
                        gain.gain.setValueAtTime(0.3, actx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + (isLast ? 0.5 : 0.15));
                        osc.start(actx.currentTime);
                        osc.stop(actx.currentTime + (isLast ? 0.5 : 0.15));
                    } catch (e) { }
                }

                playCountdownBeep(false); // Beep at start (count=5)

                const timer = setInterval(() => {
                    count--;
                    if (count <= 0) {
                        clearInterval(timer);
                        playCountdownBeep(true); // High beep = GO!
                        overlay.classList.remove('active');
                        isCountingDown = false;
                        isRawRecording = true;
                        btn.innerHTML = '<span>⏹</span> Stop Rec';
                        btn.style.borderColor = '#ef4444';
                        btn.style.color = '#ef4444';
                        btn.disabled = false;
                    } else {
                        numEl.innerText = count;
                        playCountdownBeep(false); // Normal beep each tick
                    }
                }, 1000);
            } else {
                // Stop Recording
                isRawRecording = false;
                btn.innerHTML = '<span>🔴</span> 波形記録';
                btn.style.borderColor = '#334155';
                btn.style.color = 'var(--text)';
                btn.disabled = false;
            }
        }

        // --- 音声フィードバック (Modern Synthesizer) ---
        class ToneGenerator {
            constructor() {
                this.ctx = null;
                this.soundType = 'BELL'; // Default
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            setSoundType(type) {
                this.soundType = type;
            }

            resume() {
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            // iOS対策: 無音のオシレーターを一瞬鳴らすことでContextを「アクティブ化（ロック解除）」する
            // ユーザーアクションの直接のイベントハンドラ内で呼ぶ必要がある
            unlockAudioContext() {
                this.init();
                this.resume();
                if (this.ctx && this.ctx.state !== 'running') {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    gain.gain.value = 0;
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(0);
                    osc.stop(0.01);
                }
            }

            // ヘルパー: 指定タイミングで2つの波形を重ねて鳴らす (FMライクなレイヤー)
            playOsc(type1, type2, freq1, freq2, detune, startTime, duration, vol) {
                const osc1 = this.ctx.createOscillator();
                const osc2 = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc1.type = type1;
                osc2.type = type2;
                osc1.frequency.value = freq1;
                osc2.frequency.value = freq2;
                osc2.detune.value = detune;

                osc1.connect(gain);
                osc2.connect(gain);
                gain.connect(this.ctx.destination);

                // エンベロープ (ADSR)
                gain.gain.setValueAtTime(0, startTime);
                gain.gain.linearRampToValueAtTime(vol, startTime + 0.02); // Attack
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration); // Decay / Release

                osc1.start(startTime);
                osc2.start(startTime);
                osc1.stop(startTime + duration);
                osc2.stop(startTime + duration);
            }

            playSuccess() {
                if (this.soundType === 'OFF') return;

                if (!this.ctx) this.init();
                this.resume();

                const now = this.ctx.currentTime;

                if (this.soundType === 'GAME') {
                    // モダンなゲームの「レベルアップ/決定」のようなキラキラしたアルペジオ
                    [1318.51, 1567.98, 2093.00].forEach((freq, i) => { // E6, G6, C7
                        this.playOsc('square', 'sine', freq, freq * 1.01, 5, now + i * 0.08, 0.4, 0.2);
                    });
                } else if (this.soundType === 'BEEP') {
                    // 爽快な「ピポッ」という上昇音
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.type = 'sine';

                    osc.frequency.setValueAtTime(880, now);    // A5
                    osc.frequency.setValueAtTime(1318.51, now + 0.08); // E6

                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(0.5, now + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (this.soundType === 'MECHANICAL') {
                    // 近未来UIのような「カポリッ」という軽快で有機的なクリック
                    const osc1 = this.ctx.createOscillator();
                    const gain1 = this.ctx.createGain();
                    osc1.connect(gain1);
                    gain1.connect(this.ctx.destination);

                    osc1.type = 'triangle';
                    // 急激なピッチダウンによるアタック感の強調（キックドラムの応用）
                    osc1.frequency.setValueAtTime(800, now);
                    osc1.frequency.exponentialRampToValueAtTime(100, now + 0.05);

                    gain1.gain.setValueAtTime(0, now);
                    gain1.gain.linearRampToValueAtTime(0.8, now + 0.01);
                    gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.08);

                    osc1.start(now);
                    osc1.stop(now + 0.1);
                } else {
                    // BELL (Default) - 心地よいホテルのベルのような透明感のある和音と余韻
                    // C6 と E6 をデチューンして重ねる
                    this.playOsc('sine', 'sine', 1046.50, 1318.51, 10, now, 0.8, 0.4);
                    // 少し遅れて上の G6 を鳴らして広がりを出す
                    this.playOsc('sine', 'triangle', 1567.98, 1567.98, -5, now + 0.05, 1.2, 0.2);
                }
            }

            playWarning() {
                if (this.soundType === 'OFF') return;
                if (!this.ctx) this.init();
                this.resume();
                const now = this.ctx.currentTime;
                // 注意を引くが不快すぎない、柔らかな「ポン・ポン」という警告
                for (let i = 0; i < 2; i++) {
                    this.playOsc('triangle', 'sine', 440, 440, 0, now + i * 0.25, 0.25, 0.6);
                }
            }

            playStop() {
                if (this.soundType === 'OFF') return;
                if (!this.ctx) this.init();
                this.resume();
                const now = this.ctx.currentTime;
                // 緊急だが耳を劈かない「タロラリッ（低下和音）」のような終了音
                [880, 740, 659, 523.25].forEach((freq, i) => { // A5, F#5, E5, C5
                    this.playOsc('square', 'triangle', freq, freq, 0, now + i * 0.1, 0.2, 0.3);
                });
            }

            playSetComplete() {
                if (this.soundType === 'OFF') return;
                if (!this.ctx) this.init();
                this.resume();
                const now = this.ctx.currentTime;
                // 目標回数達成時の、明るく達成感のあるファンファーレ和音
                // C5 -> E5 -> G5 -> C6 (Cメジャーアルペジオ)
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                    // 最後の音は長く伸ばす
                    const duration = i === 3 ? 0.6 : 0.15;
                    this.playOsc('square', 'sine', freq, freq * 1.005, 5, now + i * 0.12, duration, 0.4);
                });
            }
        }

        // --- v3.0 Main Logic ---

        // Per-Exercise Velocity Thresholds
        const EXERCISE_THRESHOLDS = {
            'SQ': { minPeak: 0.15, maxVelocity: 5.0 },
            'DL': { minPeak: 0.15, maxVelocity: 5.0 },
            'BP': { minPeak: 0.15, maxVelocity: 5.0 },
            'CL': { minPeak: 0.50, maxVelocity: 5.0 },
            'Other': { minPeak: 0.30, maxVelocity: 5.0 },
        };

        function getExerciseThresholds() {
            return EXERCISE_THRESHOLDS[currentExercise] || EXERCISE_THRESHOLDS['Other'];
        }

        let currentExercise = 'SQ';
        let currentWeight = 100;
        let setTargetReps = 10;
        let setTargetSets = 3;
        let currentSetCount = 1;
        let restMinutes = 2.0;

        let isSetRunning = false;
        let isResting = false;
        let restTimer = null;

        let currentMode = 'POWER';
        let setBestVelocity = 0.0;
        let repCountInSet = 0;
        let setRepData = []; // Store reps for summary
        let consecutiveWarningCount = 0;
        let lastRepPeakVelocity = null; // Previous rep peak (for critical drop check and % change)

        const MODES = {
            'POWER': { threshold: 20 },
            'STRENGTH': { threshold: 25 },
            'HYPERTROPHY': { threshold: 35 }
        };

        function updateMode() {
            const sel = document.getElementById('mode-select');
            currentMode = sel.value;
            setLog(`Mode Changed: ${currentMode}`);
            // Reset set data on mode change? Ideally yes.
            resetSetState();
        }

        function resetSetState() {
            setBestVelocity = 0.0;
            repCountInSet = 0;
            setRepData = [];
            rawLogBuffer = []; // v3.2 bugfix: clear raw log on reset!
            consecutiveWarningCount = 0;
            lastRepPeakVelocity = null;
            document.getElementById('rep-count').innerText = `0 / ${setTargetReps}`;
            document.getElementById('last-rep-max').innerText = "0.00";
            document.getElementById('fatigue-val').innerText = "0%";
            document.getElementById('fatigue-val').style.color = "var(--text)";
            updateStatusColor('neutral');
            hideAlert();
        }


        function handleStartSet() {
            // Audio Contextのサスペンド復帰（iOS対策）
            if (window.toneGen) window.toneGen.resume();

            if (isSetRunning || isCountingDown) {
                // End gracefully or cancel countdown
                endSet("STOP BOTTON PRESSED");
            } else {
                // Show modal
                document.getElementById('startup-modal').style.display = 'flex';
                // Force scroll snaps to defaults once visible
                document.getElementById('exercise-picker').scrollTop = 0; // SQ = 0
                document.getElementById('weight-picker').scrollTop = 24 * 46; // 60kg = 24 * 46
                document.getElementById('reps-picker').scrollTop = 9 * 46; // 10reps = 9 * 46

                // Add defaults for new pickers
                document.getElementById('sets-picker').scrollTop = 2 * 46; // 3 sets = index 2
                document.getElementById('rest-picker').scrollTop = 2 * 46; // 2.0 min = index 2

                // Small delay to allow display to apply before opacity transition
                setTimeout(() => {
                    document.getElementById('startup-modal').style.opacity = '1';
                }, 10);
            }
        }

        function endSet(reason) {
            isSetRunning = false;
            // Stop recording
            isRawRecording = false;

            if (isCountingDown) {
                isCountingDown = false;
                clearInterval(countdownTimer);
                document.getElementById('countdown-overlay').classList.remove('active');
            }

            // Update UI
            const btn = document.getElementById('main-start-btn');
            btn.innerHTML = '▶ SET START';
            btn.classList.remove('running');
            btn.style.background = '';
            btn.disabled = false;

            if (reason !== "STOP BOTTON PRESSED" || setRepData.length > 0) {
                setLog(`=== SET ${currentSetCount} END ===`, '#f59e0b');

                // Highlight the end of a set in the table
                const logBody = document.getElementById('log-body');
                logBody.insertAdjacentHTML('afterbegin',
                    `<tr>
                        <td colspan="4" style="text-align:center; padding: 4px; background:rgba(255,255,255,0.05); color:var(--text-dim); font-size:0.75rem;">
                            --- SET ${currentSetCount} COMPLETE ---
                        </td>
                    </tr>`
                );

                // セット終了時にCSVを自動コピー
                autoExportCSV();

                // Multi-set logic
                if (currentSetCount < setTargetSets) {
                    startRestTimer();
                } else {
                    showSummary(reason);
                }
            } else {
                // If cancelled before any reps, just reset
                resetSetState();
            }
        }

        // --- REST TIMER LOGIC ---
        function startRestTimer() {
            isResting = true;
            const overlay = document.getElementById('rest-overlay');
            const timeDisplay = document.getElementById('rest-time-display');
            const skipBtn = document.getElementById('btn-skip-rest');

            overlay.classList.add('active');
            skipBtn.classList.remove('ready');
            skipBtn.innerText = "SKIP REST";
            timeDisplay.classList.remove('ready');

            let remainingTotalSeconds = Math.floor(restMinutes * 60);

            function updateDisplay() {
                const m = Math.floor(remainingTotalSeconds / 60);
                const s = remainingTotalSeconds % 60;
                timeDisplay.innerText = `${m}:${s.toString().padStart(2, '0')}`;
            }

            updateDisplay();

            if (restTimer) clearInterval(restTimer);
            restTimer = setInterval(() => {
                remainingTotalSeconds--;
                if (remainingTotalSeconds <= 0) {
                    // Rest Completed
                    clearInterval(restTimer);
                    timeDisplay.innerText = "0:00";
                    timeDisplay.classList.add('ready');
                    window.toneGen.playSuccess(); // Ping
                    skipBtn.classList.add('ready');
                    skipBtn.innerText = "NEXT SET READY ▶";
                } else {
                    updateDisplay();
                }
            }, 1000);
        }

        window.skipRest = function () {
            if (restTimer) clearInterval(restTimer);
            isResting = false;
            document.getElementById('rest-overlay').classList.remove('active');

            // Advance to next set
            currentSetCount++;

            // Auto start the next rack-up countdown
            startSetWithCountdown();
        }

        // UI Helpers
        function updateStatusColor(status) {
            const card = document.getElementById('metric-card');
            card.className = 'metric-card'; // Reset
            if (status === 'good') card.classList.add('status-good');
            else if (status === 'warning') card.classList.add('status-warning');
            else if (status === 'stop') card.classList.add('status-stop');
        }

        function showAlert(msg) {
            const banner = document.getElementById('alert-banner');
            banner.innerText = msg;
            banner.style.display = 'block';
        }

        function hideAlert() {
            document.getElementById('alert-banner').style.display = 'none';
        }

        function showSummary(reason) {
            const ol = document.getElementById('summary-overlay');
            ol.classList.add('active');
            document.getElementById('sum-best').innerText = setBestVelocity.toFixed(2) + " m/s";
            document.getElementById('sum-reps').innerText = repCountInSet;

            // Calc Avg
            let sum = 0;
            setRepData.forEach(r => sum += r);
            const avg = setRepData.length > 0 ? (sum / setRepData.length).toFixed(2) : "0.00";
            document.getElementById('sum-avg').innerText = avg + " m/s";

            document.getElementById('sum-reason').innerText = reason;
        }

        function closeSummary() {
            document.getElementById('summary-overlay').classList.remove('active');
            resetSetState(); // Reset after summary closed
        }

        // v3.1 Data Management
        // Populate Weight Options (50-150, step 5)
        // NOOP weightSelect


        // Duration Tuning
        // v4.2.8: START_THRESHOLDを上げた結果、爆発的な挙上（山の幅が狭い）が開始判定の遅れにより150ms未満とみなされ棄却される問題に対応
        const MIN_DURATION_MS = 100;

        // 不感時間: 0.5秒（レップとレップの間の最小インターバル。ノイズ破棄からの復帰を早めるため1000->500に短縮）
        const LOCKOUT_MS = 500;

        // v3.0 Parameters - Adjusted for Sensitivity
        const START_THRESHOLD = 0.20; // v4.2.7: BPのラックアップ振動(0.1-0.15)による誤スタートを防ぐため0.12->0.20へ
        const END_THRESHOLD = 0.02;

        // Manual rep adjust removed from UI, kept in code just in case
        window.adjustRep = function (delta) {
            repCountInSet += delta;
            if (repCountInSet < 0) repCountInSet = 0;
            document.getElementById('rep-count').innerText = `${repCountInSet} / ${setTargetReps}`;
        }

        window.copyToClipboard = function () {
            const exercise = currentExercise || "NoName";
            const load = currentWeight || "0";

            // Export raw recording buffer (all data points during REC)
            if (rawLogBuffer.length > 0) {
                let csv = "Exercise,Weight(kg),Time,Velocity(m/s)\n";
                rawLogBuffer.forEach(entry => {
                    csv += `${exercise},${load},${entry.time},${entry.velocity.toFixed(3)}\n`;
                });
                clipboard(csv);
                return;
            }

            // Fallback: export rep log table if no raw data
            const rows = document.querySelectorAll('#log-body tr');
            if (rows.length === 0) {
                alert("データがありません。\nRECボタンで記録してからコピーしてください。");
                return;
            }

            let csv = "Exercise,Weight(kg),Time,Peak(m/s),Fatigue(%)\n";
            rows.forEach(row => {
                const cols = row.querySelectorAll('td');
                const time = cols[0].innerText;
                const peak = cols[1].innerText;
                const fat = cols[3].innerText.replace('%', '');
                csv += `${exercise},${load},${time},${peak},${fat}\n`;
            });
            clipboard(csv);
        };

        // セット終了時の自動CSVエクスポート（alertなしでサイレントコピー）
        function autoExportCSV() {
            const exercise = currentExercise || "NoName";
            const load = currentWeight || "0";

            if (rawLogBuffer.length > 0) {
                let csv = "Exercise,Weight(kg),Time,Velocity(m/s)\n";
                rawLogBuffer.forEach(entry => {
                    csv += `${exercise},${load},${entry.time},${entry.velocity.toFixed(3)}\n`;
                });
                silentClipboard(csv);
            }
        }

        function silentClipboard(csv) {
            if (navigator.clipboard) {
                navigator.clipboard.writeText(csv).then(() => {
                    showToast("📋 CSVをコピーしました");
                }).catch(() => {
                    // フォールバック（権限エラー時）
                    fallbackCopyTextToClipboard(csv);
                    showToast("📋 CSVをコピーしました");
                });
            } else {
                fallbackCopyTextToClipboard(csv);
                showToast("📋 CSVをコピーしました");
            }
        }

        // 一時的なトースト通知（3秒で消える）
        function showToast(message) {
            let toast = document.getElementById('csv-toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'csv-toast';
                toast.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(34,197,94,0.9);color:#fff;padding:10px 24px;border-radius:20px;font-size:0.9rem;font-weight:600;z-index:9999;opacity:0;transition:opacity 0.3s;pointer-events:none;';
                document.body.appendChild(toast);
            }
            toast.innerText = message;
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 3000);
        }

        function clipboard(csv) {
            if (navigator.clipboard) {
                navigator.clipboard.writeText(csv).then(() => {
                    alert("クリップボードにコピーしました！\nメモ帳などに貼り付けてください。");
                }).catch(err => {
                    fallbackCopyTextToClipboard(csv);
                });
            } else {
                fallbackCopyTextToClipboard(csv);
            }
        }

        function fallbackCopyTextToClipboard(text) {
            var textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.top = "0";
            textArea.style.left = "0";
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                var successful = document.execCommand('copy');
                if (successful) alert("クリップボードにコピーしました！(Legacy)");
                else alert("コピーに失敗しました。手動でコピーしてください。");
            } catch (err) {
                alert("コピー機能が制限されています。");
            }
            document.body.removeChild(textArea);
        }

        window.resetMax = function () {
            resetSetState();
            /* Also clear log logic if needed */
            document.getElementById('log-body').innerHTML = ""; // Clear table on reset
        }

        window.addEventListener('load', () => {
            // --- Graph Initialization (must be after DOM load) ---
            const graph = new LiveGraph('vbtCanvas');
            // Force initial center-line draw
            graph.draw();

            let device, characteristic;
            let currentPeak = 0;
            let isMoving = false;
            let moveStartTime = 0;
            let lastRepTime = 0; // For Lockout
            let belowThresholdStartTime = 0; // 終了判定の待機用
            let currentRepVelocities = []; // Array to store velocities during the rep
            let sessionBestPeak = 0.0;     // For Neural Readiness calculation

            // Stillness Detection for Reset
            let lastMotionTime = Date.now();

            // Params - 使用するのはグローバルスコープの START_THRESHOLD, END_THRESHOLD, MIN_DURATION_MS, LOCKOUT_MS
            // (load外で定義済み。ここでは再定義しない)
            const toneGen = new ToneGenerator();
            window.toneGen = toneGen; // Global reference for UI clicks

            const SERVICE_UUID = '19b10010-e8f2-537e-4f6c-d104768a1214';
            const CHARACTERISTIC_UUID = '19b10011-e8f2-537e-4f6c-d104768a1214';

            const connectBtn = document.getElementById('connect-btn');
            const velDisplay = document.getElementById('velocity-display');
            const btStatus = document.getElementById('bt-status');
            const logBody = document.getElementById('log-body');

            if (!navigator.bluetooth) {
                setLog('Bluetooth Not Supported', '#ef4444');
                connectBtn.disabled = true;
                return;
            }

            // Sound Selector Logic
            const soundSelect = document.getElementById('sound-select');
            soundSelect.addEventListener('change', (e) => {
                toneGen.init();    // AudioContext未初期化の場合に備えて初期化
                toneGen.resume();  // iOS等でサスペンド中の場合に備えて再開
                toneGen.setSoundType(e.target.value);
                // Preview sound
                toneGen.playSuccess();
            });

            // Populate Weight Select (50-150 step 5)
            // NOOP weightInput

            // Stillness Check Loop (1Hz)
            setInterval(() => {
                const now = Date.now();
                // If inactive (>5s) AND isMoving=false AND has reps > 0
                // 静止判定: 30秒間動きがない場合にリセット（高重量セット間のインターバルを考慮）
                if (!isMoving && repCountInSet > 0 && (now - lastMotionTime > 30000)) {
                    setLog("Auto Reset: Stillness Detected (30s)");
                    resetSetState();
                }
            }, 1000);

            function updateBatteryUI(level) {
                const batEl = document.getElementById('battery-status');
                batEl.style.display = 'inline-block';
                // Color coding based on level
                let color = "var(--good)"; // Green
                if (level <= 20) color = "var(--stop)"; // Red
                else if (level <= 50) color = "var(--warning)"; // Yellow

                batEl.style.color = color;
                batEl.innerHTML = `🔋 ${level}%`;
            }

            function onDisconnected(event) {
                setLog('Bluetooth Disconnected!', '#ef4444');
                btStatus.innerText = "切断されました";
                btStatus.className = "status-badge disconnected";
                btStatus.style.background = "#ef4444";
                connectBtn.innerHTML = "<span>⚡</span> 再接続";
                connectBtn.disabled = false;
                document.getElementById('battery-status').style.display = 'none';
            }

            let lastValidVel = 0.0;

            connectBtn.onclick = async () => {
                try {
                    device = await navigator.bluetooth.requestDevice({
                        filters: [
                            { services: [SERVICE_UUID] }
                        ],
                        optionalServices: ['battery_service'] // 0x180F
                    });

                    device.addEventListener('gattserverdisconnected', onDisconnected);

                    setLog('Connecting...');
                    toneGen.init();
                    toneGen.resume();

                    const server = await device.gatt.connect();
                    const service = await server.getPrimaryService(SERVICE_UUID);
                    characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

                    await characteristic.startNotifications();
                    setLog('Connected', '#22c55e');

                    btStatus.innerText = "Connected";
                    btStatus.className = "status-badge connected";
                    btStatus.style.background = "var(--good)";
                    connectBtn.innerHTML = "<span>✅</span> Linked";
                    connectBtn.disabled = true;

                    // --- Battery Service Connection ---
                    try {
                        const batteryService = await server.getPrimaryService('battery_service');
                        const batteryChar = await batteryService.getCharacteristic('battery_level');

                        // Read initial value
                        const batVal = await batteryChar.readValue();
                        const batLevel = batVal.getUint8(0);
                        updateBatteryUI(batLevel);

                        // Listen for changes
                        await batteryChar.startNotifications();
                        batteryChar.addEventListener('characteristicvaluechanged', (e) => {
                            updateBatteryUI(e.target.value.getUint8(0));
                        });
                    } catch (e) {
                        console.log("Battery Service not available or failed:", e);
                    }

                    let rxCount = 0; // Data Counter

                    characteristic.addEventListener('characteristicvaluechanged', (event) => {
                        const raw = event.target.value;
                        const velocity = raw.getFloat32(0, true);
                        let currentVel = Number(velocity.toFixed(3));

                        // NaN Fallback (Robutness against corrupted packets)
                        if (isNaN(currentVel)) {
                            currentVel = lastValidVel;
                        } else {
                            lastValidVel = currentVel;
                        }

                        // RX Counter + Debug Raw Value
                        rxCount++;
                        if (rxCount % 50 === 0) { // Approx 1s
                            setLog(`RX: ${rxCount}, Raw: ${velocity.toFixed(3)}`);
                        }

                        // Deadzone & Positive-Only (挙上方向のみ)
                        if (currentVel < 0) currentVel = 0.0;
                        if (currentVel < 0.02) currentVel = 0.0;

                        // Update Graph (which uses requestAnimationFrame now)
                        graph.addPoint(currentVel);

                        // Rate-limit DOM text updates to ~25Hz to drastically reduce CPU load on mobile 
                        // DOM elements modifying every 20ms kills the browser UI thread
                        if (rxCount % 2 === 0) {
                            velDisplay.innerText = currentVel.toFixed(2);
                        }

                        // Stillness Tracker (Threshold raised to 0.10 to ignore ground noise completely)
                        if (currentVel > 0.10) {
                            lastMotionTime = Date.now();
                        }

                        // RAW Record
                        if (isRawRecording) {
                            rawLogBuffer.push({
                                time: new Date().toISOString(),
                                velocity: currentVel
                            });
                        }

                        // --- Rep Detection Logic ---
                        // 測定中でない場合やカウントダウン中はRep検出しない
                        const now = Date.now();
                        if (!isSetRunning || isCountingDown) return;

                        // Start of Rep
                        if (currentVel > START_THRESHOLD) {
                            if (!isMoving && (now - lastRepTime > LOCKOUT_MS)) {
                                isMoving = true;
                                moveStartTime = now;
                                currentPeak = 0;
                                currentRepVelocities = []; // リセット
                            }
                            if (isMoving) {
                                currentRepVelocities.push(currentVel); // 蓄積
                                if (currentVel > currentPeak) {
                                    currentPeak = currentVel;
                                }
                                // 閾値を超えている間は終了カウンターをリセット
                                belowThresholdStartTime = 0;
                            }
                        } else if (isMoving && currentVel < END_THRESHOLD) {
                            currentRepVelocities.push(currentVel); // 減速中も一旦保存し続ける
                            // 終了判定の遅延 (350ms連続で閾値を下回った場合のみ終了とみなす。スクワットのボトムパウズ対策)
                            if (belowThresholdStartTime === 0) {
                                belowThresholdStartTime = now;
                            }

                            if (now - belowThresholdStartTime > 200) {
                                // End of Rep Logic
                                isMoving = false;
                                belowThresholdStartTime = 0;

                                // --- v4 MPV Calculation (デュアルフィルタリング＆絶対値Slackカット＆算術平均) ---
                                let rawArray = currentRepVelocities;
                                if (rawArray.length === 0) rawArray = [0];

                                // 1. Weak Smoothed (Size=2): 生データのトゲ抜き（MPV・Peak抽出用）
                                let weakSmoothed = [];
                                for (let i = 0; i < rawArray.length; i++) {
                                    if (i === 0) weakSmoothed.push(rawArray[i]);
                                    else weakSmoothed.push((rawArray[i] + rawArray[i - 1]) / 2);
                                }

                                // 2. Strong Smoothed (Size=5): うねりの排除・挙動判定用
                                let strongSmoothed = [];
                                for (let i = 0; i < rawArray.length; i++) {
                                    let sum = 0, count = 0;
                                    for (let j = Math.max(0, i - 4); j <= i; j++) {
                                        sum += rawArray[j];
                                        count++;
                                    }
                                    strongSmoothed.push(sum / count);
                                }

                                // 3. Peak Indexの確定 (Strong Data上での絶対最頂点)
                                // ※ノイズ増幅を防ぐため、推進区間の終了判定はStrongに任せる
                                let maxStrongVel = 0;
                                let peakIndex = 0;
                                for (let i = 0; i < strongSmoothed.length; i++) {
                                    if (strongSmoothed[i] > maxStrongVel) {
                                        maxStrongVel = strongSmoothed[i];
                                        peakIndex = i;
                                    }
                                }

                                // 4. Start Indexの確定 (Slack抜き: Weakデータが0.05m/sを超えた瞬間)
                                let startIndex = 0;
                                for (let i = 0; i <= peakIndex; i++) {
                                    if (weakSmoothed[i] > 0.05) {
                                        startIndex = i;
                                        break;
                                    }
                                }

                                // 5. データの抽出と算術平均 (Arithmetic Mean)
                                let mpvSum = 0;
                                let mpvCount = 0;
                                let repPeak = 0; // Peak VelocityはWeakスヌーズから取る

                                for (let i = 0; i < weakSmoothed.length; i++) {
                                    // 最速瞬間（Peak）はレップ全体から取得
                                    if (weakSmoothed[i] > repPeak) repPeak = weakSmoothed[i];

                                    // MPVはStartからPeakまでの中身だけを足す
                                    if (i >= startIndex && i <= peakIndex) {
                                        mpvSum += weakSmoothed[i];
                                        mpvCount++;
                                    }
                                }

                                // 物理法則に則った、真の平均推進速度（変位/時間）
                                let repMPV = mpvCount > 0 ? (mpvSum / mpvCount) : repPeak;
                                // --- END MPV CALCULATION ---

                                const duration = now - moveStartTime;
                                const exThresh = getExerciseThresholds();

                                // Peakが閾値以上かチェック（MPVだと低い場合があり弾かれるのを防ぐためPeakで判定）
                                if (repPeak >= exThresh.minPeak && repPeak <= exThresh.maxVelocity && duration > MIN_DURATION_MS) {
                                    // Valid Rep
                                    lastRepTime = now; // 成功または正当なトライアルのみ不感時間を更新
                                    repCountInSet++;
                                    setRepData.push(repMPV); // 履歴にはMPVを保存

                                    // Update UI metrics immediately
                                    document.getElementById('rep-count').innerText = `${repCountInSet} / ${setTargetReps}`;
                                    document.getElementById('last-rep-max').innerText = repPeak.toFixed(2);
                                    velDisplay.innerText = repMPV.toFixed(2); // レップ終了でMPVを巨大表示ロック

                                    // Neural Readiness Calculation
                                    if (repPeak > sessionBestPeak) sessionBestPeak = repPeak;
                                    let readiness = sessionBestPeak > 0 ? (repPeak / sessionBestPeak) * 100 : 100;
                                    const readinessUI = document.getElementById('neural-readiness');
                                    readinessUI.innerText = readiness.toFixed(0) + "%";
                                    // Change color based on neural state
                                    if (readiness >= 95) readinessUI.style.color = "var(--good)";
                                    else if (readiness >= 85) readinessUI.style.color = "var(--warning)";
                                    else readinessUI.style.color = "var(--stop)";

                                    setLog(`✅ Rep ${repCountInSet}: MPV ${repMPV.toFixed(2)}m/s | Peak ${repPeak.toFixed(2)}m/s`, 'var(--good)');

                                    // --- v4.0 JUDGMENT ENGINE ---
                                    // 1. Best Velocity Lock Logic (MPV based)
                                    if (repCountInSet <= 3) {
                                        if (repMPV > setBestVelocity) {
                                            setBestVelocity = repMPV;
                                            document.getElementById('set-best').innerText = setBestVelocity.toFixed(2);
                                        }
                                    }

                                    // 2. Fatigue Calculation (MPV based)
                                    let fatigue = 0;
                                    if (setBestVelocity > 0) {
                                        fatigue = ((setBestVelocity - repMPV) / setBestVelocity) * 100;
                                    }
                                    fatigue = Math.max(0, fatigue);
                                    document.getElementById('fatigue-val').innerText = fatigue.toFixed(0) + "%";

                                    // 3. Judgment Logic
                                    let status = 'good';
                                    let stopReason = "";
                                    const threshold = MODES[currentMode].threshold;

                                    if (currentMode === 'POWER' && setBestVelocity < 0.50) {
                                        showAlert("POWER ZONE OUT");
                                    } else {
                                        hideAlert();
                                    }

                                    let isCriticalDrop = false;
                                    if (repCountInSet >= 3 && setBestVelocity > 0) {
                                        if (repMPV < setBestVelocity * (1 - (threshold / 100) - 0.15)) {
                                            isCriticalDrop = true;
                                        }
                                    }

                                    let isAutoStop = document.getElementById('auto-stop-select').value === 'ON';

                                    if (isCriticalDrop) {
                                        if (isAutoStop) {
                                            status = 'stop';
                                            stopReason = "速度低下によりセット終了（安全装置）";
                                        } else {
                                            status = 'warning';
                                        }
                                    } else if (fatigue >= threshold + 5) {
                                        if (isAutoStop) {
                                            status = 'stop';
                                            stopReason = "目標疲労度オーバー（セット終了）";
                                        } else {
                                            status = 'warning';
                                        }
                                    } else if (fatigue >= threshold) {
                                        consecutiveWarningCount++;
                                        if (consecutiveWarningCount >= 2) {
                                            if (isAutoStop) {
                                                status = 'stop';
                                                stopReason = "疲労度閾値に連続到達（セット終了）";
                                            } else {
                                                status = 'warning';
                                            }
                                        } else {
                                            status = 'warning';
                                        }
                                    } else if (fatigue >= 15) {
                                        status = 'warning';
                                        consecutiveWarningCount = 0;
                                    } else {
                                        status = 'good';
                                        consecutiveWarningCount = 0;
                                    }

                                    // Also check target reps
                                    if (repCountInSet >= setTargetReps && status !== 'stop') {
                                        status = 'stop';
                                        stopReason = "目標回数達成（セット完了）";
                                    }

                                    updateStatusColor(status);

                                    if (status === 'stop') {
                                        if (stopReason.includes("目標回数達成")) {
                                            toneGen.playSetComplete();
                                        } else {
                                            toneGen.playStop();
                                        }
                                        endSet(stopReason);
                                        return; // セット終了後は即座に抜ける（余分な処理やログ描画を防ぐ）
                                    } else if (status === 'warning') {
                                        toneGen.playWarning();
                                    } else {
                                        toneGen.playSuccess();
                                    }

                                    // Update history tracking variables
                                    lastRepPeakVelocity = repPeak;

                                    const d = new Date();
                                    const timeStr = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
                                    const changeColor = status === 'good' ? 'var(--good)' : (status === 'warning' ? 'var(--warning)' : 'var(--stop)');

                                    logBody.insertAdjacentHTML('afterbegin',
                                        `<tr>
                                        <td>${timeStr}</td>
                                        <td><strong>${repMPV.toFixed(2)}</strong> <span style="font-size:0.7em; color:var(--text-dim);">/ ${repPeak.toFixed(2)}</span></td>
                                        <td>-</td>
                                        <td style="color:${changeColor}">${fatigue.toFixed(1)}%</td>
                                    </tr>`
                                    );
                                } else {
                                    let reason = "";
                                    if (repPeak < exThresh.minPeak) reason = `Peak too low (${repPeak.toFixed(2)} < ${exThresh.minPeak})`;
                                    else if (repPeak >= exThresh.maxVelocity) reason = "Peak too high";
                                    else if (duration <= MIN_DURATION_MS) reason = `Too short (${duration}ms < ${MIN_DURATION_MS}ms)`;
                                    if (reason) setLog(`❌ ${reason}`, 'var(--text-dim)');
                                }
                            }
                        } else if (isMoving) {
                            // 速度がEND_THRESHOLD〜START_THRESHOLDの間: まだ動いている → ピークは更新する。終了カウンターもリセット
                            if (currentVel > currentPeak) currentPeak = currentVel;
                            belowThresholdStartTime = 0;
                        }
                    }); // end characteristicvaluechanged listener

                } catch (error) {
                    console.error(error);
                    setLog('Error: ' + error.message, '#ef4444');
                }
            }; // end main-connect-btn listener
        }); // end DOMContentLoaded
    </script>

    <!-- ===== STARTUP PICKER LOGIC ===== -->
    <script>
        const EXERCISE_LABELS = {
            SQ: 'スクワット', DL: 'デッドリフト',
            BP: 'ベンチプレス', CL: 'クリーン', Other: 'その他'
        };

        // --- Weight picker: 0, 2.5, 5 ... 300 ---
        (function buildWeightPicker() {
            const scroll = document.getElementById('weight-picker');
            scroll.innerHTML = '';
            for (let w = 0; w <= 300; w += 2.5) {
                const div = document.createElement('div');
                div.className = 'picker-item';
                div.dataset.value = w;
                div.innerHTML = `${w % 1 === 0 ? w : w.toFixed(1)}<span class="picker-suffix">kg</span>`;
                scroll.appendChild(div);
            }
        })();

        // --- Reps picker: 1 to 30 ---
        (function buildRepsPicker() {
            const scroll = document.getElementById('reps-picker');
            scroll.innerHTML = '';
            for (let r = 1; r <= 30; r++) {
                const div = document.createElement('div');
                div.className = 'picker-item';
                div.dataset.value = r;
                div.innerHTML = `${r}`;
                scroll.appendChild(div);
            }
        })();

        // --- Sets picker: 1 to 10 ---
        (function buildSetsPicker() {
            const scroll = document.getElementById('sets-picker');
            scroll.innerHTML = '';
            for (let s = 1; s <= 10; s++) {
                const div = document.createElement('div');
                div.className = 'picker-item';
                div.dataset.value = s;
                div.innerHTML = `${s}`;
                scroll.appendChild(div);
            }
        })();

        // --- Rest picker: 1.0 to 5.0 (step 0.5) ---
        (function buildRestPicker() {
            const scroll = document.getElementById('rest-picker');
            scroll.innerHTML = '';
            for (let r = 1.0; r <= 5.0; r += 0.5) {
                const div = document.createElement('div');
                div.className = 'picker-item';
                div.dataset.value = r;
                div.innerHTML = `${r.toFixed(1)} <span class="picker-suffix">min</span>`;
                scroll.appendChild(div);
            }
        })();

        // --- Generic picker active-item tracking ---
        function initPicker(scrollEl, onChangeCallback, defaultIndex = 0) {
            const ITEM_H = 46;
            const items = scrollEl.querySelectorAll('.picker-item');

            function updateActive() {
                // Since container is exactly 5 items high (230px),
                // selection band is exactly at top: 92px,
                // and padding-top is exactly 92px,
                // index = scrollTop / 46. It is mathematically perfect.
                let activeIndex = Math.round(scrollEl.scrollTop / ITEM_H);

                // Keep bounded just in case
                activeIndex = Math.max(0, Math.min(items.length - 1, activeIndex));

                items.forEach((item, i) => {
                    if (i === activeIndex) {
                        item.classList.add('active');
                        if (onChangeCallback) onChangeCallback(item);
                    } else {
                        item.classList.remove('active');
                    }
                });
            }

            scrollEl.addEventListener('scroll', updateActive, { passive: true });

            // Set default (wait for DOM paint and visibility)
            setTimeout(() => {
                // 擬似要素(92px)が子要素として含まれるため、scrollTopの計算は変わらない
                scrollEl.scrollTop = defaultIndex * ITEM_H;
                updateActive();
            }, 50); // slight delay to ensure bounding rects are valid when modal shows
        }

        // --- Init exercise picker (default: SQ = index 0) ---
        const exHint = document.getElementById('exercise-label-hint');
        initPicker(document.getElementById('exercise-picker'), (item) => {
            exHint.textContent = EXERCISE_LABELS[item.dataset.value] || '';
        }, 0); // SQ=0

        // --- Init weight picker (default: 60kg = index 24) ---
        initPicker(document.getElementById('weight-picker'), null, 24); // 24 * 2.5 = 60kg

        // --- Init reps picker (default: 10 reps = index 9) ---
        initPicker(document.getElementById('reps-picker'), null, 9); // default 10 reps (index 9)

        // --- Init sets picker (default: 3 sets = index 2) ---
        initPicker(document.getElementById('sets-picker'), null, 2);

        // --- Init rest picker (default: 2.0 min = index 2) ---
        // 1.0, 1.5, 2.0 -> index 2
        initPicker(document.getElementById('rest-picker'), null, 2);

        // --- Confirm and close modal ---
        function confirmSetup() {
            // Audio Contextのサスペンド復帰および完全アンロック（iOS対策）
            // ※ボタンクリックの同期実行ツリー内で行わないとiOSは無視するため、専用メソッドを呼ぶ
            if (window.toneGen) window.toneGen.unlockAudioContext();

            const exActive = document.querySelector('#exercise-picker .picker-item.active');
            const wtActive = document.querySelector('#weight-picker .picker-item.active');
            const repActive = document.querySelector('#reps-picker .picker-item.active');
            const setsActive = document.querySelector('#sets-picker .picker-item.active');
            const restActive = document.querySelector('#rest-picker .picker-item.active');

            if (exActive) {
                currentExercise = exActive.dataset.value;
            }
            if (wtActive) {
                currentWeight = parseFloat(wtActive.dataset.value);
            }
            if (repActive) {
                setTargetReps = parseInt(repActive.dataset.value);
            }
            if (setsActive) {
                setTargetSets = parseInt(setsActive.dataset.value);
            }
            if (restActive) {
                restMinutes = parseFloat(restActive.dataset.value);
            }

            // Hard reset workout state on new configuration
            currentSetCount = 1;
            document.getElementById('log-body').innerHTML = ""; // Clear logs for new workout
            document.getElementById('set-progress').innerText = `SET ${currentSetCount} / ${setTargetSets}`;

            // Update UI info
            const modeName = document.getElementById('mode-select').options[document.getElementById('mode-select').selectedIndex].text;
            document.getElementById('current-setup-info').innerText = `${EXERCISE_LABELS[currentExercise] || currentExercise} / ${currentWeight}kg / 目標 ${setTargetReps} reps`;

            // Close modal visually first
            const modal = document.getElementById('startup-modal');
            modal.style.transition = 'opacity 0.3s ease';
            modal.style.opacity = '0';
            setTimeout(() => {
                modal.style.display = 'none';
                startSetWithCountdown();
            }, 300);
        }

        function startSetWithCountdown() {
            if (isCountingDown) return;
            isCountingDown = true;

            resetSetState(); // Reset UI immediately (velocity, fatigue)
            document.getElementById('set-progress').innerText = `SET ${currentSetCount} / ${setTargetSets}`;

            // Setup UI for countdown
            const btn = document.getElementById('main-start-btn');
            btn.innerHTML = '⏳ 準備中...';
            btn.style.background = '#f59e0b'; // orange for prep
            btn.style.color = '#fff';

            const overlay = document.getElementById('countdown-overlay');
            const numEl = document.getElementById('countdown-number');
            overlay.classList.add('active');
            let count = 5;
            numEl.innerText = count;

            function playCountdownBeep(isLast) {
                try {
                    if (!window.toneGen || !window.toneGen.ctx) return;
                    const actx = window.toneGen.ctx;

                    const osc = actx.createOscillator();
                    const gain = actx.createGain();
                    osc.connect(gain);
                    gain.connect(actx.destination);
                    osc.frequency.value = isLast ? 1200 : 800; // High pitch for "GO"
                    osc.type = isLast ? 'square' : 'sine';
                    gain.gain.setValueAtTime(0.3, actx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + (isLast ? 0.5 : 0.15));
                    osc.start(actx.currentTime);
                    osc.stop(actx.currentTime + (isLast ? 0.5 : 0.15));
                } catch (e) { }
            }

            playCountdownBeep(false);

            countdownTimer = setInterval(() => {
                count--;
                if (count <= 0) {
                    clearInterval(countdownTimer);
                    playCountdownBeep(true);
                    overlay.classList.remove('active');
                    isCountingDown = false;

                    // Actually start the set process
                    isSetRunning = true;
                    startAutoRecording();

                    // Button becomes STOP
                    btn.innerHTML = '⏹ STOP SET';
                    btn.classList.add('running');
                    btn.style.background = ''; // Remove inline so CSS class takes over
                } else {
                    numEl.innerText = count;
                    playCountdownBeep(false);
                }
            }, 1000);
        }
    </script>
