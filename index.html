<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VeloBar v3.6.1</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;600&family=Share+Tech+Mono&display=swap"
        rel="stylesheet">
    <style>
        /* ===== STARTUP PICKER MODAL ===== */
        #startup-modal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            /* PCでは中央寄りに配置 */
            background: rgba(10, 20, 40, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        @media (max-width: 600px) {
            #startup-modal {
                justify-content: flex-end;
            }

            /* モバイルでは下部に配置 */
        }

        .modal-sheet {
            width: 95%;
            max-width: 440px;
            background: rgba(30, 41, 59, 0.96);
            border-radius: 24px;
            padding: 24px 20px 40px;
            box-shadow: 0 8px 40px rgba(0, 243, 255, 0.2);
            border: 1px solid rgba(0, 243, 255, 0.2);
            animation: slideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @media (max-width: 600px) {
            .modal-sheet {
                border-radius: 24px 24px 0 0;
                width: 100%;
                border-left: none;
                border-right: none;
                border-bottom: none;
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-handle {
            width: 40px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            margin: 0 auto 20px;
        }

        .modal-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            color: var(--primary);
            text-align: center;
            margin-bottom: 24px;
            letter-spacing: 2px;
        }

        .pickers-row {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .picker-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .picker-label {
            font-size: 0.75rem;
            color: var(--text-dim);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .picker-container {
            position: relative;
            width: 100%;
            height: 180px;
            overflow: hidden;
            border-radius: 14px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(0, 243, 255, 0.15);
        }

        /* Selection highlight band */
        .picker-container::before,
        .picker-container::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            height: 60px;
            z-index: 2;
            pointer-events: none;
        }

        .picker-container::before {
            top: 0;
            background: linear-gradient(to bottom, rgba(30, 41, 59, 0.95), transparent);
        }

        .picker-container::after {
            bottom: 0;
            background: linear-gradient(to top, rgba(30, 41, 59, 0.95), transparent);
        }

        .picker-selection-band {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 46px;
            transform: translateY(-50%);
            background: rgba(0, 243, 255, 0.08);
            border-top: 1px solid rgba(0, 243, 255, 0.3);
            border-bottom: 1px solid rgba(0, 243, 255, 0.3);
            z-index: 1;
            pointer-events: none;
        }

        .picker-scroll {
            height: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            -ms-overflow-style: none;
            /* IE/Edge対応 */
            padding: 67px 0;
        }

        .picker-scroll::-webkit-scrollbar {
            display: none;
        }

        .picker-item {
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            scroll-snap-align: center;
            font-size: 1.2rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            transition: color 0.15s, font-size 0.15s;
            cursor: default;
            user-select: none;
        }

        .picker-item.active {
            color: var(--primary);
            font-size: 1.35rem;
            text-shadow: 0 0 12px rgba(0, 243, 255, 0.5);
        }

        .picker-suffix {
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-left: 4px;
            font-family: 'Inter', sans-serif;
        }

        .btn-start {
            width: 100%;
            margin-top: 24px;
            padding: 16px;
            background: linear-gradient(135deg, #00f3ff 0%, #0088ff 100%);
            color: #0f172a;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 2px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px 24px rgba(0, 243, 255, 0.4);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .btn-start:active {
            transform: scale(0.97);
            box-shadow: 0 2px 12px rgba(0, 243, 255, 0.3);
        }

        :root {
            --primary: #00f3ff;
            --bg: #0f172a;
            --surface: #1e293b;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --good: #22c55e;
            --warning: #f59e0b;
            --stop: #ef4444;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            /* Prevent horizontal scroll */
        }

        /* Ultra Compact Header v2.2 + v3.0 Mode Selector */
        .header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            /* Ultra-compact padding */
            background: var(--surface);
            border-bottom: 1px solid #334155;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            /* Smaller font */
            margin: 0;
            color: var(--primary);
            letter-spacing: 1px;
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
            background: #334155;
            color: var(--text-dim);
            transition: all 0.3s;
        }

        .status-badge.connected {
            background: rgba(34, 197, 94, 0.2);
            color: var(--good);
        }

        /* Mode Selector */
        .mode-select {
            background: #334155;
            color: var(--text);
            border: 1px solid #475569;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 0.8rem;
            font-family: 'Inter', sans-serif;
            outline: none;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 10px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            /* Extremely reduced gap */
        }

        /* Main Metric Card - v3.0 Layout */
        .metric-card {
            background: var(--surface);
            border-radius: 16px;
            padding: 12px;
            /* Ultra compact */
            margin-bottom: 4px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
            border: 2px solid #334155;
            /* Default neutral border */
            position: relative;
            overflow: hidden;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        /* Traffic Light System Styles */
        .status-good {
            border-color: var(--good) !important;
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.2) !important;
        }

        .status-warning {
            border-color: var(--warning) !important;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.2) !important;
        }

        .status-stop {
            border-color: var(--stop) !important;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4) !important;
        }

        .metric-label {
            font-size: 0.85rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .metric-value-container {
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: 4px;
        }

        .metric-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 4.5rem;
            /* Large visibility */
            font-weight: 700;
            color: var(--text);
            line-height: 1;
        }

        .metric-unit {
            font-size: 1.5rem;
            color: var(--text-dim);
        }

        /* Sub Metrics (Rep, Best, Fatigue) */
        .sub-metrics {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
            /* compact */
            padding-top: 8px;
            border-top: 1px solid #334155;
        }

        .sub-metric {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .sub-metric .label {
            font-size: 0.7rem;
            color: var(--text-dim);
        }

        .sub-metric .value {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text);
        }

        .fatigue-value {
            color: var(--text);
            /* Will be dynamic */
        }

        /* Rep Change Overlay */
        .rep-change {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            position: absolute;
            top: 16px;
            right: 16px;
        }

        /* Warning Banners */
        .alert-banner {
            background: rgba(239, 68, 68, 0.2);
            color: var(--stop);
            padding: 8px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            display: none;
            /* Hidden by default */
            margin-top: 8px;
            border: 1px solid var(--stop);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 0.8;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.8;
            }
        }

        /* Graph Container */
        .graph-container {
            background: var(--surface);
            border-radius: 16px;
            padding: 8px;
            border: 1px solid #334155;
            height: 160px;
            /* Reduced fixed height */
            position: relative;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Countdown Overlay */
        #countdown-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        #countdown-overlay.active {
            display: flex;
        }

        #countdown-number {
            font-family: 'Orbitron', sans-serif;
            font-size: 30vw;
            font-weight: 900;
            color: var(--primary);
            text-shadow: 0 0 60px var(--primary), 0 0 120px var(--primary);
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.1);
                opacity: 0.8;
            }
        }

        /* Control Panel */
        .control-panel {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-top: 4px;
        }

        .btn-main {
            grid-column: 1 / -1;
            padding: 16px;
            font-size: 1.25rem;
            border-radius: 12px;
            background: linear-gradient(135deg, #00f3ff 0%, #0088ff 100%);
            color: #0f172a;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            border: none;
            box-shadow: 0 4px 15px rgba(0, 243, 255, 0.4);
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-main:active {
            transform: scale(0.97);
        }

        .btn-main.running {
            background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
            color: white;
        }

        .btn {
            background: var(--surface);
            border: 1px solid #334155;
            color: var(--text);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: rgba(0, 243, 255, 0.1);
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Set Summary Overlay */
        .summary-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .summary-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .summary-card {
            background: var(--surface);
            padding: 24px;
            border-radius: 16px;
            text-align: center;
            width: 80%;
            max-width: 320px;
            border: 1px solid var(--primary);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.2);
        }

        .summary-title {
            font-size: 1.5rem;
            color: var(--text);
            margin-bottom: 16px;
            font-family: 'Orbitron', sans-serif;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 1rem;
            color: var(--text-dim);
        }

        .summary-row span.val {
            color: var(--text);
            font-weight: 600;
        }

        .summary-reason {
            color: var(--stop);
            font-weight: bold;
            margin-top: 12px;
            font-size: 1.1rem;
        }

        /* Log Table */
        .log-container {
            background: var(--surface);
            border-radius: 16px;
            padding: 12px;
            border: 1px solid #334155;
            max-height: 200px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        th,
        td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }

        th {
            color: var(--text-dim);
            font-weight: 500;
        }

        td {
            color: var(--text);
        }

        /* Connection Log (Hidden mostly but useful for debug) */
        #connection-log {
            font-size: 0.7rem;
            color: var(--text-dim);
            margin-top: 10px;
            max-height: 50px;
            overflow-y: auto;
        }
    </style>
</head>

<body>

    <!-- ===== STARTUP PICKER MODAL ===== -->
    <div id="startup-modal">
        <div class="modal-sheet">
            <div class="modal-handle"></div>
            <div class="modal-title">⚡ SETUP</div>
            <div class="pickers-row">
                <!-- Exercise Picker -->
                <div class="picker-wrap" style="flex:0.8;">
                    <div class="picker-label">種目</div>
                    <div class="picker-container">
                        <div class="picker-selection-band"></div>
                        <div class="picker-scroll" id="exercise-picker">
                            <div class="picker-item" data-value="SQ">SQ</div>
                            <div class="picker-item" data-value="DL">DL</div>
                            <div class="picker-item" data-value="BP">BP</div>
                            <div class="picker-item" data-value="CL">CL</div>
                            <div class="picker-item" data-value="Other">Oth</div>
                        </div>
                    </div>
                    <div style="font-size:0.7rem;color:var(--text-dim);" id="exercise-label-hint">スクワット</div>
                </div>
                <!-- Weight Picker -->
                <div class="picker-wrap">
                    <div class="picker-label">重量</div>
                    <div class="picker-container">
                        <div class="picker-selection-band"></div>
                        <div class="picker-scroll" id="weight-picker">
                        </div>
                    </div>
                    <div style="font-size:0.7rem;color:var(--text-dim);">kg</div>
                </div>
                <!-- Target Reps Picker -->
                <div class="picker-wrap" style="flex:0.8;">
                    <div class="picker-label">目標回数</div>
                    <div class="picker-container">
                        <div class="picker-selection-band"></div>
                        <div class="picker-scroll" id="reps-picker">
                        </div>
                    </div>
                    <div style="font-size:0.7rem;color:var(--text-dim);">reps</div>
                </div>
            </div>
            <button class="btn-start" onclick="confirmSetup()">START ▶</button>
        </div>
    </div>

    <!-- Overlay for Set Summary -->

    <div id="summary-overlay" class="summary-overlay" onclick="closeSummary()">
        <div class="summary-card">
            <div class="summary-title">セット終了</div>
            <div class="summary-row"><span>自己ベスト</span><span class="val" id="sum-best">-</span></div>
            <div class="summary-row"><span>平均速度</span><span class="val" id="sum-avg">-</span></div>
            <div class="summary-row"><span>回数</span><span class="val" id="sum-reps">-</span></div>
            <div class="summary-reason" id="sum-reason">理由</div>
            <div style="margin-top: 20px; font-size: 0.8rem; color: #64748b;">(タップして閉じる)</div>
        </div>
    </div>

    <!-- Countdown Overlay -->
    <div id="countdown-overlay">
        <span id="countdown-number">5</span>
    </div>

    <div class="header">
        <div class="header-left">
            <h1>VeloBar <span style="font-size: 0.8em; color: var(--primary);">v3.6.1</span></h1>
            <div style="display: flex; gap: 8px; align-items: center;">
                <span id="bt-status" class="status-badge">未接続</span>
                <span id="battery-status" class="status-badge"
                    style="background: rgba(255,255,255,0.1); display: none;">🔋 --%</span>
            </div>
        </div>
        <!-- Mode Selector -->
        <select id="mode-select" class="mode-select" onchange="updateMode()">
            <option value="POWER">パワー (VL 20%)</option>
            <option value="STRENGTH">筋力 (VL 25%)</option>
            <option value="HYPERTROPHY">筋肥大 (VL 35%)</option>
        </select>
    </div>

    <div class="container">

        <!-- Status Bar -->
        <div
            style="display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-dim); align-items: center;">
            <div id="current-setup-info">SET START で設定してください</div>
            <div>
                通知音:
                <select id="sound-select" class="mode-select" style="font-size: 0.75rem; padding: 2px 4px;">
                    <option value="BELL">ベル</option>
                    <option value="GAME">ゲーム</option>
                    <option value="BEEP">電子音</option>
                    <option value="MECHANICAL">機械音</option>
                    <option value="OFF">なし</option>
                </select>
            </div>
        </div>

        <!-- Main Metric ID for JS reference -->
        <div id="metric-card" class="metric-card">
            <div class="metric-label" style="font-size: 0.75rem;">リアルタイム・ピーク速度 (m/s)</div>
            <div class="metric-value-container">
                <span id="velocity-display" class="metric-value" style="font-size: 5rem;">0.00</span>
            </div>

            <div id="rep-change" class="rep-change">-</div>

            <!-- Alerts -->
            <div id="alert-banner" class="alert-banner">パワーゾーン圏外</div>

            <div class="sub-metrics">
                <div class="sub-metric">
                    <span class="label">回数</span>
                    <span id="rep-count" class="value">0 / --</span>
                </div>
                <div class="sub-metric">
                    <span class="label">1Rep Max</span>
                    <span id="last-rep-max" class="value">0.00</span>
                </div>
                <div class="sub-metric">
                    <span class="label">対ベスト疲労度</span>
                    <span id="fatigue-val" class="value fatigue-value">0%</span>
                </div>
            </div>
        </div>

        <div class="graph-container">
            <canvas id="vbtCanvas"></canvas>
        </div>

        <div class="control-panel">
            <button id="main-start-btn" class="btn-main" onclick="handleStartSet()">▶ SET START</button>
            <button id="connect-btn" class="btn"><span>⚡</span> 接続</button>
            <button class="btn" onclick="resetMax()"><span>🔄</span> リセット</button>
            <button class="btn" onclick="copyToClipboard(false)"><span>📋</span> CSV</button>
        </div>

        <div class="log-container">
            <table>
                <thead>
                    <tr>
                        <th>時刻</th>
                        <th>速度 (m/s)</th>
                        <th>比率</th>
                        <th>疲労度</th>
                    </tr>
                </thead>
                <tbody id="log-body">
                    <!-- Logs go here -->
                </tbody>
            </table>
        </div>

        <div id="record-status" style="text-align: center; color: var(--text-dim); font-size: 0.8rem;"></div>
        <div id="connection-log"></div>
    </div>

    <script>
        // --- 描画エンジン (ライブラリなし) ---
        class LiveGraph {
            constructor(canvasId) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.data = [];
                // 50Hz * 8秒 = 400点 (波形の幅を広げる)
                this.maxPoints = 400;
                this.yLimit = 3.0; // 0〜3m/s (VBTの主要レンジ)

                this.resize();
                window.addEventListener('resize', () => this.resize());
            }

            resize() {
                this.canvas.width = this.canvas.clientWidth * window.devicePixelRatio;
                this.canvas.height = this.canvas.clientHeight * window.devicePixelRatio;
            }

            addPoint(val) {
                this.data.push(val);
                if (this.data.length > this.maxPoints) {
                    this.data.shift();
                }

                // Web Bluetoothの受信スレッドを詰まらせないために、描画をブラウザのレンダリングサイクルに委譲する
                if (!this.pendingDraw) {
                    this.pendingDraw = true;
                    requestAnimationFrame(() => this.draw());
                }
            }

            draw() {
                this.pendingDraw = false;
                const { width, height } = this.canvas;
                const ctx = this.ctx;

                ctx.clearRect(0, 0, width, height);

                // Grid
                ctx.strokeStyle = '#1e293b'; // Dark blue grid
                ctx.lineWidth = 1;
                ctx.beginPath();
                for (let i = 0; i <= this.yLimit; i += 1) {
                    let y = height - (i / this.yLimit) * height;
                    ctx.moveTo(0, y);
                    ctx.lineTo(width, y);
                }
                ctx.stroke();

                // Baseline (0 m/s)
                ctx.strokeStyle = '#475569';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, height - 2); // Slightly offset for visibility
                ctx.lineTo(width, height - 2);
                ctx.stroke();

                // Data Plot
                if (this.data.length < 2) return;

                ctx.strokeStyle = '#00f3ff'; // Bright Cyan for Data
                ctx.lineWidth = 3;
                // Revert Deadzone Logic (User Request)
                // But make it slightly more lenient for visibility?
                // "0.003" is serial. "0.01" filter.
                // If user shakes it, it should exceed 0.01 easily unless broken.
                // User says "0.003" in SERIAL. That is TINY. Usually stationary noise.
                // If the user moves it, it should jump to >0.1.

                ctx.shadowBlur = 10;
                ctx.shadowColor = '#00f3ff';
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.beginPath();

                for (let i = 0; i < this.data.length; i++) {
                    let x = (i / (this.maxPoints - 1)) * width;
                    let plotVal = Math.max(0, Math.min(this.yLimit, this.data[i]));
                    let y = height - (plotVal / this.yLimit) * height;

                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
                ctx.shadowBlur = 0; // Reset shadow
            }
        }

                    try {
                        const actx = new (window.AudioContext || window.webkitAudioContext)();
                        const osc = actx.createOscillator();
                        const gain = actx.createGain();
                        osc.connect(gain);
                        gain.connect(actx.destination);
                        osc.frequency.value = isLast ? 1200 : 800; // High pitch for "GO"
                        gain.gain.setValueAtTime(0.3, actx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + (isLast ? 0.5 : 0.15));
                        osc.start(actx.currentTime);
                        osc.stop(actx.currentTime + (isLast ? 0.5 : 0.15));
                    } catch (e) { }
                }

                playCountdownBeep(false); // Beep at start (count=5)

                const timer = setInterval(() => {
                    count--;
                    if (count <= 0) {
                        clearInterval(timer);
                        playCountdownBeep(true); // High beep = GO!
                        overlay.classList.remove('active');
                        isCountingDown = false;
                        isRawRecording = true;
                        btn.innerHTML = '<span>⏹</span> Stop Rec';
                        btn.style.borderColor = '#ef4444';
                        btn.style.color = '#ef4444';
                        btn.disabled = false;
                    } else {

                    }

            }
        }

        // --- 音声フィードバック ---
        class ToneGenerator {
            constructor() {
                this.ctx = null;
                this.soundType = 'BELL'; // Default
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            setSoundType(type) {
                this.soundType = type;
            }

            resume() {
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playSuccess() {
                if (this.soundType === 'OFF') return;

                if (!this.ctx) this.init();
                this.resume();

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);

                if (this.soundType === 'GAME') {
                    // 8-bit Coin Sound (louder)
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(988, now); // B5
                    osc.frequency.setValueAtTime(1319, now + 0.1); // E6
                    gain.gain.setValueAtTime(0.4, now);
                    gain.gain.linearRampToValueAtTime(0.4, now + 0.1);
                    gain.gain.linearRampToValueAtTime(0, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                } else if (this.soundType === 'BEEP') {
                    // Simple Short Beep (louder)
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1000, now);
                    gain.gain.setValueAtTime(0.4, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (this.soundType === 'MECHANICAL') {
                    // Click / Mechanical (louder)
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(50, now + 0.08);
                    gain.gain.setValueAtTime(0.8, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else {
                    // BELL (Default) - Sophisticated Ding (louder)
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, now);
                    osc.frequency.exponentialRampToValueAtTime(440, now + 0.15);
                    gain.gain.setValueAtTime(0.5, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
                    osc.start(now);
                    osc.stop(now + 0.6);
                }
            }

            playWarning() {
                if (this.soundType === 'OFF') return;
                if (!this.ctx) this.init();
                this.resume();
                const now = this.ctx.currentTime;
                // Double beep warning
                for (let i = 0; i < 2; i++) {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(660, now + i * 0.2);
                    gain.gain.setValueAtTime(0.5, now + i * 0.2);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.2 + 0.12);
                    osc.start(now + i * 0.2);
                    osc.stop(now + i * 0.2 + 0.12);
                }
            }

            playStop() {
                if (this.soundType === 'OFF') return;
                if (!this.ctx) this.init();
                this.resume();
                const now = this.ctx.currentTime;
                // Urgent alarm: 4 rapid high-pitched beeps
                for (let i = 0; i < 4; i++) {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(1200, now + i * 0.15);
                    osc.frequency.setValueAtTime(800, now + i * 0.15 + 0.05);
                    gain.gain.setValueAtTime(0.6, now + i * 0.15);
                    gain.gain.linearRampToValueAtTime(0, now + i * 0.15 + 0.1);
                    osc.start(now + i * 0.15);
                    osc.stop(now + i * 0.15 + 0.1);
                }
            }
        }

        window.addEventListener('load', () => {
            // --- Graph Initialization (must be after DOM load) ---
            const graph = new LiveGraph('vbtCanvas');
            // Force initial center-line draw

            let device, characteristic;

            let moveStartTime = 0;

            let belowThresholdStartTime = 0; // 終了判定の待機用

            // Stillness Detection for Reset
            let lastMotionTime = Date.now();

            // Params
            // 不感時間: 1.0秒
            const LOCKOUT_MS = 1000;
            // 最小継続時間: 0.35秒以上動き続けていない場合はノイズとみなす
            const MIN_DURATION_MS = 350;

            // v3.0 Parameters
            const START_THRESHOLD = 0.15; // 0.10のノイズを拾わないように少し引き上げ
            const END_THRESHOLD = 0.05;   // 確実に静止を捉える
            const toneGen = new ToneGenerator();
            window.toneGen = toneGen; // Global reference for UI clicks

            const SERVICE_UUID = '19b10010-e8f2-537e-4f6c-d104768a1214';
            const CHARACTERISTIC_UUID = '19b10011-e8f2-537e-4f6c-d104768a1214';

            const connectBtn = document.getElementById('connect-btn');
            const velDisplay = document.getElementById('velocity-display');
            const btStatus = document.getElementById('bt-status');

            if (!navigator.bluetooth) {

            // Sound Selector Logic

            // Populate Weight Select (50-150 step 5)
            // NOOP weightInput


            // Stillness Check Loop (1Hz)
            setInterval(() => {
                const now = Date.now();
                // If inactive (>5s) AND isMoving=false AND has reps > 0
                // 静止判定: 30秒間動きがない場合にリセット（高重量セット間のインターバルを考慮）
                if (!isMoving && repCountInSet > 0 && (now - lastMotionTime > 30000)) {
                    setLog("Auto Reset: Stillness Detected (30s)");

            }, 1000);

            function updateBatteryUI(level) {
                const batEl = document.getElementById('battery-status');
                batEl.style.display = 'inline-block';
                // Color coding based on level
                let color = "var(--good)"; // Green
                if (level <= 20) color = "var(--stop)"; // Red
                else if (level <= 50) color = "var(--warning)"; // Yellow

                batEl.style.color = color;
                batEl.innerHTML = `🔋 ${level}%`;
            }

            function onDisconnected(event) {
                setLog('Bluetooth Disconnected!', '#ef4444');
                btStatus.innerText = "切断されました";
                btStatus.className = "status-badge disconnected";
                btStatus.style.background = "#ef4444";
                connectBtn.innerHTML = "<span>⚡</span> 再接続";
                connectBtn.disabled = false;
                document.getElementById('battery-status').style.display = 'none';
            }

            let lastValidVel = 0.0;

            connectBtn.onclick = async () => {
                try {
                    device = await navigator.bluetooth.requestDevice({
                        filters: [
                            { services: [SERVICE_UUID] }
                        ],
                        optionalServices: ['battery_service'] // 0x180F
                    });

                    device.addEventListener('gattserverdisconnected', onDisconnected);

                    setLog('Connecting...');
                    toneGen.init();
                    toneGen.resume();

                    const server = await device.gatt.connect();
                    const service = await server.getPrimaryService(SERVICE_UUID);
                    characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

                    await characteristic.startNotifications();
                    setLog('Connected', '#22c55e');

                    btStatus.innerText = "Connected";
                    btStatus.className = "status-badge connected";
                    btStatus.style.background = "var(--good)";
                    connectBtn.innerHTML = "<span>✅</span> Linked";
                    connectBtn.disabled = true;

                    // --- Battery Service Connection ---
                    try {
                        const batteryService = await server.getPrimaryService('battery_service');
                        const batteryChar = await batteryService.getCharacteristic('battery_level');

                        // Read initial value
                        const batVal = await batteryChar.readValue();
                        const batLevel = batVal.getUint8(0);
                        updateBatteryUI(batLevel);

                        // Listen for changes
                        await batteryChar.startNotifications();
                        batteryChar.addEventListener('characteristicvaluechanged', (e) => {
                            updateBatteryUI(e.target.value.getUint8(0));
                        });
                    } catch (e) {
                        console.log("Battery Service not available or failed:", e);
                    }

                    let rxCount = 0; // Data Counter

                    characteristic.addEventListener('characteristicvaluechanged', (event) => {
                        const raw = event.target.value;
                        const velocity = raw.getFloat32(0, true);
                        let currentVel = Number(velocity.toFixed(3));

                        // NaN Fallback (Robutness against corrupted packets)
                        if (isNaN(currentVel)) {
                            currentVel = lastValidVel;
                        } else {
                            lastValidVel = currentVel;
                        }

                        // RX Counter + Debug Raw Value
                        rxCount++;
                        if (rxCount % 50 === 0) { // Approx 1s
                            setLog(`RX: ${rxCount}, Raw: ${velocity.toFixed(3)}`);
                        }

                        // Deadzone & Positive-Only (挙上方向のみ)
                        if (currentVel < 0) currentVel = 0.0;
                        if (currentVel < 0.02) currentVel = 0.0;

                        // Update Graph (which uses requestAnimationFrame now)
                        graph.addPoint(currentVel);

                        // Rate-limit DOM text updates to ~25Hz to drastically reduce CPU load on mobile 
                        // DOM elements modifying every 20ms kills the browser UI thread
                        if (rxCount % 2 === 0) {
                            velDisplay.innerText = currentVel.toFixed(2);
                        }

                        // Stillness Tracker (Threshold raised to 0.10 to ignore ground noise completely)
                        if (currentVel > 0.10) {
                            lastMotionTime = Date.now();
                        }

                        // RAW Record
                        if (isRawRecording) {
                            rawLogBuffer.push({
                                time: new Date().toISOString(),
                                velocity: currentVel
                            });
                        }

                        // --- Rep Detection Logic ---
                        // ラックアップ誤認防止: カウントダウン中はRep検出しない
                        const now = Date.now();
                        if (isCountingDown) return;

                        // Start of Rep
                        if (currentVel > START_THRESHOLD) {
                            if (!isMoving && (now - lastRepTime > LOCKOUT_MS)) {
                                isMoving = true;
                                moveStartTime = now;
                                currentPeak = 0;
                            }
                            if (isMoving) {
                                if (currentVel > currentPeak) {
                                    currentPeak = currentVel;
                                }
                                // 閾値を超えている間は終了カウンターをリセット
                                belowThresholdStartTime = 0;
                            }
                        } else if (isMoving && currentVel < END_THRESHOLD) {
                            // 終了判定の遅延 (350ms連続で閾値を下回った場合のみ終了とみなす。スクワットのボトムパウズ対策)
                            if (belowThresholdStartTime === 0) {
                                belowThresholdStartTime = now;
                            }

                            if (now - belowThresholdStartTime > 350) {
                                // End of Rep Logic
                                isMoving = false;
                                belowThresholdStartTime = 0;
                                // lastRepTime = now; // ここでは更新しない（バウンスに邪魔させないため）

                                const duration = now - moveStartTime;
                                const exThresh = getExerciseThresholds();
                                if (currentPeak >= exThresh.minPeak && currentPeak < exThresh.maxVelocity && duration > MIN_DURATION_MS) {
                                    // バウンスノイズフィルター: ベストの25%以下はノイズとみなす（40%は厳しすぎた）
                                    if (setBestVelocity > 0 && repCountInSet >= 1 && currentPeak < setBestVelocity * 0.25) {
                                        setLog(`⚠️ Bounce filtered: ${currentPeak.toFixed(2)} < 25% of best (${setBestVelocity.toFixed(2)})`, 'var(--text-dim)');
                                    } else {
                                        // Valid Rep or legitimate attempt
                                        lastRepTime = now; // 成功または正当なトライアルのみ不感時間を更新
                                        // Rep Validated
                                        repCountInSet++;
                                        setRepData.push(currentPeak);
                                        document.getElementById('rep-count').innerText = `${repCountInSet} / ${setTargetReps}`;
                                        document.getElementById('last-rep-max').innerText = currentPeak.toFixed(2);
                                        setLog(`✅ Rep ${repCountInSet}: ${currentPeak.toFixed(2)} m/s (${duration}ms)`, 'var(--good)');

                                        // --- v3.0 JUDGMENT ENGINE ---
                                        // 1. Best Velocity Lock Logic
                                        if (repCountInSet <= 3) { // Rep 1〜3でベスト速度を更新（PAP効果を考慮）
                                            if (currentPeak > setBestVelocity) {
                                                setBestVelocity = currentPeak;
                                                document.getElementById('set-best').innerText = setBestVelocity.toFixed(2);
                                            }
                                        }

                                        // 2. Fatigue Calculation
                                        let fatigue = 0;
                                        if (setBestVelocity > 0) {
                                            fatigue = ((setBestVelocity - currentPeak) / setBestVelocity) * 100;
                                        }
                                        fatigue = Math.max(0, fatigue);

                                        const fatEl = document.getElementById('fatigue-val');
                                        fatEl.innerText = fatigue.toFixed(0) + "%";

                                        // 3. Judgment Logic
                                        let status = 'good';
                                        let stopReason = "";
                                        const threshold = MODES[currentMode].threshold;

                                        if (currentMode === 'POWER' && setBestVelocity < 0.50) {
                                            showAlert("POWER ZONE OUT");
                                        } else {
                                            hideAlert();
                                        }

                                        let isCriticalDrop = false;
                                        if (repCountInSet >= 3 && setBestVelocity > 0) {
                                            if (currentPeak < setBestVelocity * (1 - (threshold / 100) - 0.15)) {
                                                isCriticalDrop = true;
                                            }
                                        }

                                        if (isCriticalDrop) {
                                            status = 'stop';
                                            stopReason = "速度低下によりセット終了（安全装置）";
                                        } else if (fatigue >= threshold + 5) {
                                            status = 'stop';
                                            stopReason = "目標疲労度オーバー（セット終了）";
                                        } else if (fatigue >= threshold) {
                                            consecutiveWarningCount++;
                                            if (consecutiveWarningCount >= 2) {
                                                status = 'stop';
                                                stopReason = "疲労度閾値に連続到達（セット終了）";
                                            } else {
                                                status = 'warning';
                                            }
                                        } else if (fatigue >= 15) {
                                            status = 'warning';
                                            consecutiveWarningCount = 0;
                                        } else {
                                            status = 'good';
                                            consecutiveWarningCount = 0;
                                        }

                                        // Also check target reps
                                        if (repCountInSet >= setTargetReps && status !== 'stop') {
                                            status = 'stop';
                                            stopReason = "目標回数達成（セット完了）";
                                        }

                                        updateStatusColor(status);

                                        if (status === 'stop') {
                                            toneGen.playStop();
                                            endSet(stopReason);
                                        } else if (status === 'warning') {
                                            toneGen.playWarning();
                                        } else {
                                            toneGen.playSuccess();
                                        }

                                        lastRepPeakVelocity = currentPeak;
                                        lastRepTime = now;

                                        const d = new Date();
                                        const timeStr = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
                                        const changeColor = status === 'good' ? 'var(--good)' : (status === 'warning' ? 'var(--warning)' : 'var(--stop)');

                                        logBody.insertAdjacentHTML('afterbegin',
                                            `<tr>
                                        <td>${timeStr}</td>
                                        <td>${currentPeak.toFixed(2)}</td>
                                        <td>-</td>
                                        <td style="color:${changeColor}">${fatigue.toFixed(1)}%</td>
                                    </tr>`
                                        );
                                    } // end bounce filter else
                                } else {
                                    let reason = "";
                                    if (currentPeak < exThresh.minPeak) reason = `Peak too low (${currentPeak.toFixed(2)} < ${exThresh.minPeak})`;
                                    else if (currentPeak >= exThresh.maxVelocity) reason = "Peak too high";
                                    else if (duration <= MIN_DURATION_MS) reason = `Too short (${duration}ms < ${MIN_DURATION_MS}ms)`;
                                    if (reason) setLog(`❌ ${reason}`, 'var(--text-dim)');
                                }
                            }
                        } else if (isMoving) {
                            // 速度がEND_THRESHOLD〜START_THRESHOLDの間: まだ動いている → ピークは更新する。終了カウンターもリセット
                            if (currentVel > currentPeak) currentPeak = currentVel;
                            belowThresholdStartTime = 0;
                        }
                    });
                } catch (error) {
                    console.error(error);
                    setLog('Error: ' + error.message, '#ef4444');
                }
            };
        });
    </script>

    <!-- ===== STARTUP PICKER LOGIC ===== -->
    <script>
        const EXERCISE_LABELS = {
            SQ: 'スクワット', DL: 'デッドリフト',
            BP: 'ベンチプレス', CL: 'クリーン', Other: 'その他'
        };

        // --- Weight picker: 0, 2.5, 5 ... 300 ---
        (function buildWeightPicker() {
            const scroll = document.getElementById('weight-picker');
            scroll.innerHTML = '';
            for (let w = 0; w <= 300; w += 2.5) {
                const div = document.createElement('div');
                div.className = 'picker-item';
                div.dataset.value = w;
                div.innerHTML = `${w % 1 === 0 ? w : w.toFixed(1)}<span class="picker-suffix">kg</span>`;
                scroll.appendChild(div);
            }
        })();

        // --- Reps picker: 1 to 30 ---
        (function buildRepsPicker() {
            const scroll = document.getElementById('reps-picker');
            scroll.innerHTML = '';
            for (let r = 1; r <= 30; r++) {
                const div = document.createElement('div');
                div.className = 'picker-item';
                div.dataset.value = r;
                div.innerHTML = `${r}`;
                scroll.appendChild(div);
            }
        })();

        // --- Generic picker active-item tracking ---
        function initPicker(scrollEl, onChangeCallback, defaultIndex = 0) {
            const ITEM_H = 46;
            const items = scrollEl.querySelectorAll('.picker-item');

            function updateActive() {
                // The visual center we care about is the middle of the container
                // Given padding-top is 67px, visually center index 0 is at scrollTop 0
                // We just need to divide scrollTop by ITEM_H to find index.
                let centerIndex = Math.round(scrollEl.scrollTop / ITEM_H);

                // Keep bounded
                centerIndex = Math.max(0, Math.min(items.length - 1, centerIndex));

                items.forEach((item, i) => {
                    if (i === centerIndex) {
                        item.classList.add('active');
                        if (onChangeCallback) onChangeCallback(item);
                    } else {
                        item.classList.remove('active');
                    }
                });
            }

            scrollEl.addEventListener('scroll', updateActive, { passive: true });

            // Set default
            requestAnimationFrame(() => {
                scrollEl.scrollTop = defaultIndex * ITEM_H;
                updateActive();
            });
        }

        // --- Init exercise picker (default: SQ = index 0) ---
        const exHint = document.getElementById('exercise-label-hint');
        initPicker(document.getElementById('exercise-picker'), (item) => {
            exHint.textContent = EXERCISE_LABELS[item.dataset.value] || '';
        }, 0); // SQ=0

        // --- Init weight picker (default: 60kg = index 24) ---
        initPicker(document.getElementById('weight-picker'), null, 24); // 24 * 2.5 = 60kg

        // --- Init reps picker (default: 10 reps = index 9) ---
        initPicker(document.getElementById('reps-picker'), null, 9); // default 10 reps (index 9)

        // --- Confirm and close modal ---
        function confirmSetup() {
            // Audio Contextのサスペンド復帰（iOS対策）
            if (window.toneGen) window.toneGen.resume();

            const exActive = document.querySelector('#exercise-picker .picker-item.active');
            const wtActive = document.querySelector('#weight-picker .picker-item.active');
            const repActive = document.querySelector('#reps-picker .picker-item.active');

            if (exActive) {
                currentExercise = exActive.dataset.value;
            }
            if (wtActive) {
                currentWeight = parseFloat(wtActive.dataset.value);
            }
            if (repActive) {
                setTargetReps = parseInt(repActive.dataset.value);
            }

            // Update UI info
            const modeName = document.getElementById('mode-select').options[document.getElementById('mode-select').selectedIndex].text;
            document.getElementById('current-setup-info').innerText = `${EXERCISE_LABELS[currentExercise] || currentExercise} / ${currentWeight}kg / 目標 ${setTargetReps} reps`;

            // Close modal visually first
            const modal = document.getElementById('startup-modal');
            modal.style.transition = 'opacity 0.3s ease';
            modal.style.opacity = '0';
            setTimeout(() => {
                modal.style.display = 'none';
                startSetWithCountdown();
            }, 300);
        }

        function startSetWithCountdown() {
            if (isCountingDown) return;
            isCountingDown = true;

            resetSetState(); // Reset UI immediately

            // Setup UI for countdown
            const btn = document.getElementById('main-start-btn');
            btn.innerHTML = '⏳ 準備中...';
            btn.style.background = '#f59e0b'; // orange for prep
            btn.style.color = '#fff';

            const overlay = document.getElementById('countdown-overlay');
            const numEl = document.getElementById('countdown-number');
            overlay.classList.add('active');
            let count = 5;
            numEl.innerText = count;

            function playCountdownBeep(isLast) {
                try {
                    const actx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = actx.createOscillator();
                    const gain = actx.createGain();
                    osc.connect(gain);
                    gain.connect(actx.destination);
                    osc.frequency.value = isLast ? 1200 : 800; // High pitch for "GO"
                    osc.type = isLast ? 'square' : 'sine';
                    gain.gain.setValueAtTime(0.3, actx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + (isLast ? 0.5 : 0.15));
                    osc.start(actx.currentTime);
                    osc.stop(actx.currentTime + (isLast ? 0.5 : 0.15));
                } catch (e) { }
            }

            playCountdownBeep(false);

            countdownTimer = setInterval(() => {
                count--;
                if (count <= 0) {
                    clearInterval(countdownTimer);
                    playCountdownBeep(true);
                    overlay.classList.remove('active');
                    isCountingDown = false;

                    // Actually start the set process
                    isSetRunning = true;
                    startAutoRecording();

                    // Button becomes STOP
                    btn.innerHTML = '⏹ STOP SET';
                    btn.classList.add('running');
                    btn.style.background = ''; // Remove inline so CSS class takes over
                } else {
                    numEl.innerText = count;
                    playCountdownBeep(false);
                }
            }, 1000);
        }
    </script>
